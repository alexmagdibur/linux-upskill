schema_version: 1
id: ld-016
version: 2
title: Потоковая обработка большого журнала с атомарной публикацией
mode: practice
difficulty: senior
estimated_minutes: 30
description: Обработайте журнал без загрузки в память и опубликуйте отчёт так, чтобы при сбое не появлялся частичный
  результат.
skills:
- потоковая обработка
- os.replace
- fsync
- временные файлы
objectives:
- Считать статистику построчно
- Публиковать атомарно
- Оставлять прежний отчёт при сбое
task: 'Напишите `~/bin/report.py ЖУРНАЛ ОТЧЁТ`:


  - читает журнал **построчно** (проверка подаст ~300 тыс. строк при лимите памяти ≈120 МБ) и считает число строк
  по коду `status=NNN`;

  - записывает отчёт — JSON-объект `{"200": n, "404": m, ...}` — в `ОТЧЁТ` **атомарно** (запись во временный файл
  рядом + `os.replace`);

  - если в журнале встретилась строка со словом `CORRUPT`, завершается с кодом `2`, **не трогая прежний отчёт**
  и не оставляя временных файлов.

  '
lesson: 150
stage: Этап 4. Синьор
topic: Потоки, текст и данные
task_type: C
environment: C
theory: Потоковая обработка ограничивает память, а временный файл и rename защищают публикацию результата.
prediction: Что видит читатель при сбое? Сформулируй гипотезу и способ её проверить.
criterion: ограничение памяти, точность и отсутствие частичного результата при сбое.
followups:
  Быстрый возврат: 'LD-015: Почему простое удаление всей строки ухудшает расследование? Ответь без справки и назови
    наблюдение, которое подтвердит ответ.'
runtime:
  type: container
  image: ubuntu-basic
  timeout_seconds: 1800
setup:
  script: setup/prepare.sh
validation:
  type: script
  script: checks/validate.sh
  timeout_seconds: 15
  exercise_script: checks/exercise.sh
  checks:
  - id: counts_ok
    title: 'Большой журнал: верные счётчики в лимите памяти'
    pass_message: Счётчики верны
    fail_message: На большом журнале счётчики неверны или процесс не уложился в память
  - id: failure_keeps_old
    title: 'Сбой: прежний отчёт цел, код 2'
    pass_message: При сбое прежний отчёт сохранён
    fail_message: При CORRUPT нужен код 2 и неизменённый прежний отчёт
  - id: no_temp_leftovers
    title: Временных файлов не осталось
    pass_message: Временных файлов нет
    fail_message: Рядом с отчётом остались временные файлы
reward:
  base_xp: 250
