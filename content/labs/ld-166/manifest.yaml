schema_version: 1
id: ld-166
version: 2
title: 'Инцидент: подозрительный процесс переживает перезапуск'
mode: incident
difficulty: senior
estimated_minutes: 30
description: Найдите механизм закрепления процесса, соберите артефакты и устраните его так, чтобы он не вернулся
  после перезагрузки.
skills:
- ps -ef --forest
- cron @reboot
- ls -la скрытых каталогов
- сбор артефактов
objectives:
- Найти процесс и способ его возврата
- Сохранить доказательства до удаления
- Убрать закрепление
task: '**Инцидент.** В системе работает подозрительный процесс из скрытого каталога `/usr/local/lib/.upd/`. После
  его остановки он «оживает» после перезагрузки.


  1. Найдите процесс и выясните, **как он возвращается** (подсказка: планировщики).

  2. **Сохраните артефакты до удаления:** скопируйте скрипт процесса и файл, который его запускает, в `~/evidence/`
  (с теми же именами файлов).

  3. **Остановите** процесс и **уберите механизм закрепления** (скрипт можно удалить).


  Проверка перезагрузит машину: процесса не должно быть, а в `~/evidence/` — неизменённые копии.

  '
lesson: 187
stage: Этап 4. Синьор
topic: Безопасность
task_type: I
environment: V
theory: Persistence может жить в service, timer, cron, SSH и профилях shell.
prediction: Что сохранить до очистки для расследования? Сформулируй гипотезу и способ её проверить.
criterion: механизм удалён, доказательства сохранены.
followups:
  Быстрый возврат: 'LD-165: Где хранить и как передать секрет? Ответь без справки и назови наблюдение, которое подтвердит
    ответ.'
runtime:
  type: lxd
  image: ubuntu-systemd
  timeout_seconds: 1800
setup:
  script: setup/prepare.sh
validation:
  type: script
  script: checks/validate.sh
  timeout_seconds: 15
  reboot_before_validate: true
  checks:
  - id: process_gone
    title: Процесса нет после reboot
    pass_message: Процесс не вернулся
    fail_message: Подозрительный процесс снова запущен после перезагрузки
  - id: persistence_removed
    title: Механизм закрепления убран
    pass_message: Закрепление удалено
    fail_message: В /etc/cron.d остался файл, запускающий процесс
  - id: evidence_saved
    title: Артефакты сохранены без изменений
    pass_message: Артефакты сохранены
    fail_message: В ~/evidence нет неизменённых копий agent.sh и sysupdate
reward:
  base_xp: 250
