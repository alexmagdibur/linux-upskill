schema_version: 1
id: ld-108
version: 2
title: DNAT к backend с сохранением реального адреса клиента
mode: practice
difficulty: middle
estimated_minutes: 35
description: Настройте перенаправление порта на backend так, чтобы backend видел настоящий IP клиента, а не адрес
  маршрутизатора.
skills:
- nft nat prerouting
- dnat to
- ip_forward
- masquerade vs без SNAT
objectives:
- Настроить DNAT
- Разрешить forwarding
- Не маскарадить трафик
task: '> В учебной машине `ip netns exec` и `ip -n` недоступны (в контейнере нельзя смонтировать `/sys`). Команды
  внутри namespace выполняйте так: `sudo nsenter --net=/run/netns/ИМЯ команда`.


  Схема: клиент **`cli`** (`10.84.1.2`) → **машина** (`10.84.1.1`, порт `8080`) → backend **`be`** (`10.84.2.2`,
  порт `80`, возвращает `backend`, логирует адрес клиента в `/var/lib/lab/seen`).


  Настройте на машине:


  - включённый `net.ipv4.ip_forward`;

  - DNAT: запросы на `10.84.1.1:8080` перенаправляются на `10.84.2.2:80` (таблица `ip nat`, цепочка prerouting);

  - правило разрешающего forward, если у вас включён firewall;

  - **без masquerade/SNAT**: backend должен видеть адрес клиента `10.84.1.2`.


  Проверка: `curl http://10.84.1.1:8080/` из `cli` возвращает `backend`, а в `seen` — `10.84.1.2`.

  '
lesson: 117
stage: Этап 3. Мидл
topic: Firewall и NAT
task_type: P
environment: N
theory: DNAT меняет адрес назначения, SNAT — источника; это влияет на обратный путь и логи.
prediction: Какие адреса видит backend? Сформулируй гипотезу и способ её проверить.
criterion: запрос достигает нужного сервиса и путь документирован.
followups:
  Быстрый возврат: 'LD-107: Как доказать, какое правило отбросило healthcheck? Ответь без справки и назови наблюдение,
    которое подтвердит ответ.'
runtime:
