title: 'nftables: SSH только с управляющего узла, HTTP — из клиентской сети'
mode: practice
difficulty: junior
estimated_minutes: 30
description: Настройте input-политику с запретом по умолчанию и точечными разрешениями по подсетям.
skills:
- nft
- input chain
- policy drop
- ct state
- ip saddr
objectives:
- Запретить входящее по умолчанию
- Разрешить SSH только с mgmt
- Разрешить HTTP только из клиентской сети
task: '> В учебной машине `ip netns exec` и `ip -n` недоступны (в контейнере нельзя смонтировать `/sys`). Команды
  внутри namespace выполняйте так: `sudo nsenter --net=/run/netns/ИМЯ команда`.


  Узлы: **`mgmt`** (`10.81.1.2`, управляющая сеть) и **`cli`** (`10.81.2.2`, клиентская сеть). На машине слушают
  порты `22` (учебный «SSH») и `80` (HTTP).


  Настройте nftables (таблица `inet filter`, цепочка `input`, hook input) так, чтобы:


  - политика по умолчанию — **drop**; loopback и уже установленные соединения (`ct state established,related`) разрешены;

  - порт **22** доступен **только** из `10.81.1.0/24`;

  - порт **80** доступен **только** из `10.81.2.0/24`;

  - ICMP ping от обоих узлов разрешён.


  Сохраните правила в `/etc/nftables.conf` (чтобы они переживали перезагрузку) и примените их.

  '
lesson: 55
