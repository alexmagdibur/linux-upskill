schema_version: 1
id: linux-001
version: 2
title: Навигация по файловой системе
mode: learn
difficulty: beginner
estimated_minutes: 10
description: 'Научитесь ориентироваться в дереве каталогов: pwd, ls, cd, абсолютные и относительные пути.'
skills:
- pwd
- ls
- cd
- абсолютные пути
objectives:
- Найти каталог с нужным файлом
- Записать его абсолютный путь
- Создать каталог в домашней директории
task: 'В вашем домашнем каталоге лежит учебный проект `~/lab`.


  1. Изучите структуру проекта командами `ls` и `cd`.

  2. Найдите каталог, в котором находится файл `config.ini`, и запишите его **абсолютный путь** в файл `~/lab/answer.txt`.

  3. Создайте пустой каталог `~/lab/notes`.


  Подсказка по формату: абсолютный путь начинается с `/`, например `/home/student/lab/docs`.

  '
runtime:
  type: container
  image: ubuntu-basic
  timeout_seconds: 1800
setup:
  script: setup/prepare.sh
validation:
  type: script
  script: checks/validate.sh
  timeout_seconds: 15
  checks:
  - id: answer_path
    title: В answer.txt записан путь к каталогу с config.ini
    pass_message: Путь указан верно
    fail_message: В ~/lab/answer.txt нет абсолютного пути к каталогу с config.ini
  - id: notes_dir
    title: Создан каталог ~/lab/notes
    pass_message: Каталог notes создан
    fail_message: Каталог ~/lab/notes не найден
reward:
  base_xp: 50
lesson: 5
stage: Этап 1. Новичок
topic: Терминал, shell и окружение
task_type: L
environment: C
theory: '`pwd`, `ls`, `cd` и абсолютные пути связывают положение в дереве с конкретным файлом.'
prediction: Почему два одинаковых имени файла могут обозначать разные объекты? Сформулируй гипотезу и способ её
  проверить.
criterion: Путь указывает на нужный каталог; `notes` существует.
followups:
  Быстрый возврат: 'NB-004: Как изменится смысл `data/report.txt` после `cd`? Ответь без справки и назови наблюдение,
    которое подтвердит ответ.'
