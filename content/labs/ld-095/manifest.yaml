schema_version: 1
id: ld-095
version: 2
title: 'Асимметричная маршрутизация: ответы приходят не оттуда'
mode: incident
difficulty: senior
estimated_minutes: 35
description: Запрос и ответ идут разными путями, и строгий reverse path filter отбрасывает ответы. Найдите причину
  по счётчикам и устраните.
skills:
- rp_filter
- nstat IPReversePathFilter
- ip route get
- tcpdump
objectives:
- Увидеть, что ответ приходит на другой интерфейс
- Найти отбрасывание по счётчику
- Исправить фильтр обратного пути
task: '> В учебной машине `ip netns exec` и `ip -n` недоступны (в контейнере нельзя смонтировать `/sys`). Команды
  внутри namespace выполняйте так: `sudo nsenter --net=/run/netns/ИМЯ команда`.


  Узел `peer` соединён с машиной двумя кабелями: сеть A (`10.91.0.0/24`, машина `10.91.0.1`, узел `10.91.0.2`) и
  сеть B (`10.92.0.0/24`, машина `10.92.0.1`, узел `10.92.0.2`). Сервис на машине слушает порт 8080.


  Из узла `peer` запрос с адреса `10.92.0.2` на `10.91.0.1:8080` уходит через сеть A, а ответ машина отправляет
  в сеть B (так устроены маршруты) — ответ приходит на другой интерфейс узла и **отбрасывается** (`rp_filter`).


  Проверьте: `sudo nsenter --net=/run/netns/peer curl --http0.9 --interface 10.92.0.2 -m 3 http://10.91.0.1:8080/`
  (сервис отвечает без HTTP-заголовков, поэтому нужен ключ `--http0.9`) зависает. Найдите причину (`nstat -az IPReversePathFilter`
  внутри `peer`) и устраните её в узле `peer` **без изменения маршрутов** (loose-режим `rp_filter=2` на интерфейсах
  узла).

  '
