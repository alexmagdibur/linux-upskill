schema_version: 1
id: ld-106
version: 2
title: 'Stateful-правило: почему ответы не возвращаются'
mode: practice
difficulty: middle
estimated_minutes: 20
description: Входящая политика drop блокирует ответы на исходящие соединения. Добавьте правило для established/related
  и объясните причину.
skills:
- conntrack
- ct state
- established,related
- ответный трафик
objectives:
- Увидеть, что ответы отбрасываются
- Добавить stateful-правило
- Объяснить причину письменно
task: '> В учебной машине `ip netns exec` и `ip -n` недоступны (в контейнере нельзя смонтировать `/sys`). Команды
  внутри namespace выполняйте так: `sudo nsenter --net=/run/netns/ИМЯ команда`.


  Машина обращается к серверу в узле `srv` (`10.82.0.2:8000`), но `curl http://10.82.0.2:8000/` зависает: ответы
  блокирует входящая политика `drop`.


  1. Добавьте в цепочку `inet filter input` правило `ct state established,related accept` (политика drop остаётся;
  в **закрытый** порт 9999 соединения извне по-прежнему не пускаются).

  2. В `~/why.txt` одной-двумя фразами объясните причину (упомяните слова `established` и `conntrack`).

  '
lesson: 115
stage: Этап 3. Мидл
topic: Firewall и NAT
