schema_version: 1
id: ld-097
version: 2
title: 'Сервис слушает не там: адрес bind и недоступность снаружи'
mode: practice
difficulty: junior
estimated_minutes: 20
description: Служба отвечает локально, но недоступна для клиента из другого узла. Найдите адрес bind и исправьте.
skills:
- ss -ltnp
- bind address
- 127.0.0.1 vs 0.0.0.0
- curl
objectives:
- Определить, на каком адресе и порту слушает сервис
- Понять разницу loopback и внешнего адреса
- Исправить конфигурацию
task: '> В учебной машине `ip netns exec` и `ip -n` недоступны (в контейнере нельзя смонтировать `/sys`). Команды
  внутри namespace выполняйте так: `sudo nsenter --net=/run/netns/ИМЯ команда`.


  Служба `labweb.service` (HTTP, порт `8081`) отвечает на `127.0.0.1`, но клиент в узле `cli` (`10.65.0.2`) не может
  подключиться к машине (`10.65.0.1:8081`).


  1. Определите по `ss -ltnp`, на каком адресе слушает служба.

  2. Исправьте конфигурацию службы (адрес — аргумент после порта в `ExecStart`), перезапустите её.


  Результат: `curl http://10.65.0.1:8081/` из узла `cli` возвращает `lab-ok`. Служба не должна слушать «все интерфейсы»,
  если можно ограничиться адресом `10.65.0.1` (допустим и `0.0.0.0`).

  '
lesson: 54
stage: Этап 2. Джун
topic: TCP, DNS и HTTP
task_type: P
