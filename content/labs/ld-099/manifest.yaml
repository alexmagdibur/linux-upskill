    title: Резолвер отдаёт 10.20.0.55
    pass_message: Резолвер отдаёт актуальный адрес
    fail_message: Кэширующий резолвер всё ещё отдаёт старый адрес
  - id: ttl_sane
    title: TTL в конфигах ≤ 60 с
    pass_message: TTL приведены в порядок
    fail_message: min-cache-ttl/local-ttl в конфигурации больше 60 секунд
  - id: ttl_in_answer
    title: TTL в ответе ≤ 60
    pass_message: В ответе небольшой TTL
    fail_message: TTL ответа резолвера больше 60 секунд
