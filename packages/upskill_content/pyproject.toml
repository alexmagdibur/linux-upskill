[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upskill-content"
version = "0.1.0"
description = "Схемы и загрузчик учебного контента Linux Upskill (общая библиотека API и worker)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[tool.setuptools]
packages = ["upskill_content"]
